name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.decide.outputs.should-build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # Explicit tag push: always release.
          if [ "$EVENT" != "schedule" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled run: release only if code changed since the most
          # recently updated published release (tag or rolling nightly —
          # the baseline must be frozen, so resolve its tag to a commit).
          # Conservative default when a baseline cannot be established.
          echo "should-build=true" >> "$GITHUB_OUTPUT"
          REL_TAG=$(gh api "repos/lovely-error/sigil/releases?per_page=20" --jq 'map(select(.draft != true)) | max_by(.updated_at).tag_name' 2>/dev/null || true)
          if [ -z "$REL_TAG" ] || [ "$REL_TAG" = "null" ]; then
            echo "no published release yet -> build"
            exit 0
          fi
          LATEST_SHA=$(git rev-parse "refs/tags/${REL_TAG}^{commit}" 2>/dev/null || true)
          if [ -z "$LATEST_SHA" ]; then
            echo "release tag $REL_TAG not in checkout history -> build"
            exit 0
          fi
          if git diff --quiet "$LATEST_SHA" HEAD -- src Cargo.toml Cargo.lock; then
            echo "no code changes since $REL_TAG -> skip"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "code changes since $REL_TAG -> build"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test (sigma example must check)
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/sigil-neo
          if [ ! -x "$BIN" ]; then BIN="$BIN.exe"; fi
          "$BIN" check examples/sigma.sig
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f sigil-neo.exe ]; then
            tar czf ../../../sigil-neo-${{ matrix.target }}.tar.gz sigil-neo.exe
          else
            tar czf ../../../sigil-neo-${{ matrix.target }}.tar.gz sigil-neo
          fi
      - name: Upload (tag push -> versioned release)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: sigil-neo-${{ matrix.target }}.tar.gz
      - name: Upload (schedule -> rolling nightly prerelease)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FILE="sigil-neo-${{ matrix.target }}.tar.gz"
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "$FILE" --clobber
            gh release edit nightly --target "$GITHUB_SHA"
            gh api -X PATCH "repos/lovely-error/sigil/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create nightly --prerelease --title nightly --target "$GITHUB_SHA" "$FILE" \
              || gh release upload nightly "$FILE" --clobber
          fi
